<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard — LUMÉRA Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="admin.css" />
  <script>window.__SUPABASE__ = { url: 'YOUR_SUPABASE_URL', anonKey: 'YOUR_SUPABASE_ANON_KEY' };</script>
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar"></aside>

    <main class="main">
      <div class="page-head">
        <div>
          <button class="menu-toggle" id="menuToggle">☰</button>
          <h1 style="display:inline-block;margin-left:12px;">Dashboard</h1>
          <p>Overview of your store performance</p>
        </div>
      </div>

      <div class="stats" id="stats">
        <div class="spinner"></div>
      </div>

      <div class="card">
        <div class="card-head">
          <h3>Recent Orders</h3>
          <a href="orders.html" class="btn btn-secondary btn-sm">View All</a>
        </div>
        <div class="card-body">
          <table class="table" id="recentOrders">
            <thead>
              <tr>
                <th>Order #</th>
                <th>Customer</th>
                <th>Total</th>
                <th>Status</th>
                <th>Date</th>
              </tr>
            </thead>
            <tbody><tr><td colspan="5" class="empty">Loading...</td></tr></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <script src="../js/supabase-client.js"></script>
  <script src="admin.js"></script>
  <script>
    (async () => {
      const session = await Admin.requireAuth();
      if (!session) return;
      Admin.initShell('dashboard');

      try {
        const [orders, products] = await Promise.all([
          sb.adminListOrders(),
          sb.adminListProducts()
        ]);

        const totalRevenue = orders.filter(o => o.status !== 'cancelled').reduce((s, o) => s + Number(o.total || 0), 0);
        const pendingCount = orders.filter(o => o.status === 'pending').length;

        document.getElementById('stats').innerHTML = `
          <div class="stat">
            <div class="label">Total Revenue</div>
            <div class="value">${Admin.fmtMoney(totalRevenue)}</div>
            <div class="change">All-time</div>
          </div>
          <div class="stat">
            <div class="label">Total Orders</div>
            <div class="value">${orders.length}</div>
            <div class="change">${pendingCount} pending</div>
          </div>
          <div class="stat">
            <div class="label">Products</div>
            <div class="value">${products.length}</div>
            <div class="change">${products.filter(p => p.is_active).length} active</div>
          </div>
          <div class="stat">
            <div class="label">Avg Order Value</div>
            <div class="value">${orders.length ? Admin.fmtMoney(totalRevenue / orders.length) : '0.00 EGP'}</div>
            <div class="change">Per order</div>
          </div>`;

        const recent = orders.slice(0, 8);
        const tbody = document.querySelector('#recentOrders tbody');
        if (!recent.length) {
          tbody.innerHTML = '<tr><td colspan="5" class="empty">No orders yet.</td></tr>';
        } else {
          tbody.innerHTML = recent.map(o => `
            <tr>
              <td><strong>${Admin.escape(o.order_number)}</strong></td>
              <td>${Admin.escape(o.customer_name)}</td>
              <td>${Admin.fmtMoney(o.total)}</td>
              <td><span class="badge ${o.status}">${o.status}</span></td>
              <td>${Admin.fmtDate(o.created_at)}</td>
            </tr>`).join('');
        }
      } catch (err) {
        Admin.toast(err.message, 'error');
      }
    })();
  </script>
</body>
</html>
